<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Chatty - Speak freely</title>

        <link rel="stylesheet" href="/static/css/common.css">
        <link href="/static/css/index.css" rel="stylesheet">
    </head>
    <body>
        <div class="backdrop">
            <aside>
                <div class="sidebar-header">
                    <p class="brand">Chatty</p>
                    <button 
                        type="button"
                        class="btn btn-borderless btn-new-chat"
                        popovertarget="friend-list"
                    >&plus; New chat</button>
                </div>
                <div class="chat-list"></div>
                <div class="user-area">
                    <div class="user-card">
                        <div class="user-group">
                            <div class="image-wrapper image-circle user-photo">
                                <img src="static/assets/default.png" alt="">
                            </div>    
                            <button id="menu-btn" class="btn btn-borderless" popovertarget="setting-menu">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                >
                                <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                    <path
                                        d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"
                                    />
                                </svg>
                            </button>
                        </div>
                        
                        <p class="user-name"></p>
                    </div>
                </div>
            </aside>
            <main>
                <div class="chat-header">
                    <!-- photo and name -->
                    <div class="image-wrapper image-circle chat-header-photo">
                        <img src="/static/assets/default.png" alt="">
                    </div>
                    <p class="chat-header-name"></p>
                    <div class="room-option">
                        <button
                            type="button"
                            class="btn btn-borderless"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                                <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                            </svg>
                        </button>
                        <div class="room-option-dropdown">
                            <button type="button" id="chat-delete-all" class="btn btn-borderless room-option-item">Delete All</button>
                        </div>
                    </div>
                </div>
                <div class="chat-area">
                    <!-- chat bubble -->
                </div>
                <div class="chat-input">
                    <!-- typing place -->
                    <form id="chat-form">
                        <textarea
                            rows="1"
                            name="message"
                            placeholder="Start chatting..."
                            disabled
                        ></textarea>
                        <button 
                            type="submit"
                            class="btn btn-borderless"
                            disabled
                        >
                            <svg 
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="size-6"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
                                />
                            </svg>
                        </button>
                    </form>
                </div>
            </main>
        </div>
        <!-- Popovers -->
        <div id="setting-menu" popover>
            <p class="brand">Chatty</p>
            <button type="button" id="profile-btn" class="btn btn-borderless" popovertarget="profile" popovertargetaction="toggle">Profile</button>
            <button type="button" id="setting-btn" class="btn btn-borderless">Setting</button>
            <button type="button" id="logout-btn" class="btn btn-borderless">Logout</button>
        </div>
        <div id="friend-list" popover>
            <input type="text" name="search" placeholder="Search name or @username...">
            <div id="friend-list-area"></div>
        </div>

        <!-- notification -->
        <div id="confirm-dialogue">
            <p class="confirm-text">Are you sure?</p>
            <button type="button" class="btn btn-borderless confirm-cancel">Cancel</button>
            <button type="button" class="btn btn-borderless confirm-success">OK</button>
        </div>

        <script type="module" src="/static/dist/main.js"></script>
    </body>
</html>
